<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="On the way">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#003194">
<title>Hucha del Camino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#e9ece6;--card:#fbfcfa;--ink:#1f2b2e;--mute:#5d6b6e;--acc:#e0a800;--blue:#1d4f7a;--ok:#3f7d4e;--bad:#b3402f;--line:#d3d9d2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#141b1d;--card:#1e282b;--ink:#eaefe9;--mute:#9aa9ab;--acc:#f2b705;--blue:#6fa8dc;--ok:#7cc18b;--bad:#ef8a78;--line:#2f3c3f}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#141b1d;--card:#1e282b;--ink:#eaefe9;--mute:#9aa9ab;--acc:#f2b705;--blue:#6fa8dc;--ok:#7cc18b;--bad:#ef8a78;--line:#2f3c3f}
:root{--c0:#d6451f;--c1:#1d7fb8;--c2:#8e44ad;--c3:#23834a;--gt:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--c0:#ff8a65;--c1:#5ec0f0;--c2:#c995e8;--c3:#6fd699;--gt:#141b1d}}
:root[data-theme="dark"]{--c0:#ff8a65;--c1:#5ec0f0;--c2:#c995e8;--c3:#6fd699;--gt:#141b1d}
header:before{content:"";display:block;height:6px;border-radius:3px;margin-bottom:10px;background:linear-gradient(90deg,var(--c0) 25%,var(--acc) 25% 50%,var(--c1) 50% 75%,var(--c3) 75%)}
.grp .row{background:color-mix(in srgb,var(--g) 10%,var(--card));border-color:color-mix(in srgb,var(--g) 40%,var(--line))}
.grp .pm.plus{background:var(--g);border-color:var(--g);color:var(--gt)}
.grp .pm:not(.plus){border-color:var(--g)}
.grp .ctl span{color:var(--g)}
nav button:nth-child(1).on{border-top-color:var(--c0);color:var(--c0)}
nav button:nth-child(2).on{border-top-color:var(--acc)}
nav button:nth-child(3).on{border-top-color:var(--c1);color:var(--c1)}
nav button:nth-child(4).on{border-top-color:var(--c2);color:var(--c2)}
nav button:nth-child(5).on{border-top-color:var(--c3);color:var(--c3)}
nav button:nth-child(6).on{border-top-color:var(--c0);color:var(--c0)}
nav button{font-size:12.5px}
.gl{margin:6px 0 0;padding-left:20px;font-size:15px;line-height:1.5}.gl li{margin:6px 0}
.mail{display:block;text-align:center;text-decoration:none;color:var(--ink)}
.stats .st:nth-child(1){border-top:5px solid var(--c1)}
.stats .st:nth-child(2){border-top:5px solid var(--c0)}
.stats .st:nth-child(3){border-top:5px solid var(--c3)}
.stats .st:nth-child(4){border-top:5px solid var(--c2)}
.stats .st:nth-child(5){border-top:5px solid var(--acc)}
.big b{color:var(--c3)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:0 14px 96px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:12px 0 10px;z-index:5;border-bottom:1px solid var(--line)}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em}
.top b{font-size:17px}
.bar{height:10px;background:var(--line);border-radius:6px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--c0),var(--acc),var(--c3));border-radius:6px;transition:width .5s}
h2{font-size:15px;margin:22px 0 4px;font-weight:700}
.sub{color:var(--mute);font-size:13px;margin:0 0 8px}
.grp{margin-top:22px}
.grp h2{margin:0 0 6px;display:inline-block;background:var(--g);color:var(--gt);padding:5px 14px;border-radius:999px;font-size:15px}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:8px}
.row .n{flex:1;min-width:0}
.row .n b{display:block;font-weight:700;font-size:15px}
.row .n small{color:var(--mute);font-size:12.5px}
.low{color:var(--bad)!important;font-weight:700}
.ctl{display:flex;align-items:center;gap:8px}
.ctl span{min-width:26px;text-align:center;font-weight:800;font-size:18px}
button{font:inherit;cursor:pointer;color:var(--ink)}
.pm{width:46px;height:46px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-size:26px;line-height:1;font-weight:700}
.pm.plus{background:var(--acc);border-color:var(--acc);color:#1f2b2e}
.pm:active{transform:scale(.94)}
.mat .n b{font-size:19px}.mat .n small{font-size:15px;font-weight:600}
.mat .tot{font-size:30px;font-weight:800;line-height:1}
.ord .mat{margin-top:8px}.falta{margin-top:8px;padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--acc) 38%,var(--card));border:2px solid var(--acc);font-weight:700;font-size:15px}.ord.fin{background:color-mix(in srgb,var(--c3) 14%,var(--card))}
.mat .ctl{gap:10px}.mat .ctl span{font-size:36px;min-width:56px;line-height:1}
.mat .pm{width:54px;height:54px;font-size:30px}
.mat.pend{background:color-mix(in srgb,var(--acc) 38%,var(--card));border:2px solid var(--acc)}
.mat.done{background:color-mix(in srgb,var(--c3) 14%,var(--card));border-color:var(--c3)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.sw{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:12px}
.sw.on{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
.sw input{width:22px;height:22px;accent-color:var(--acc)}
.sw small{display:block;color:var(--mute);font-size:12.5px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px);z-index:9}
nav button{flex:1;border:0;background:none;padding:14px 2px;font-size:13.5px;font-weight:600;color:var(--mute);border-top:3px solid transparent}
nav button.on{color:var(--ink);border-top-color:var(--acc);font-weight:800}
.pig{width:100%;max-width:300px;display:block;margin:10px auto 0}
.big{text-align:center}
.big b{font-size:44px;font-weight:800;letter-spacing:-.02em;display:block;line-height:1.1}
.big span{color:var(--mute)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.st{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.st small{color:var(--mute);display:block;font-size:12.5px}
.st b{font-size:18px}
.way{list-style:none;margin:8px 0 0;padding:0 0 0 14px;border-left:3px dashed var(--line)}
.way li{position:relative;padding:6px 0 10px 18px;color:var(--mute)}
.way li:before{content:"";position:absolute;left:-23px;top:10px;width:14px;height:14px;border-radius:50%;background:var(--bg);border:3px solid var(--line)}
.way li.done{color:var(--ink)}
.way li.done:before{background:var(--ok);border-color:var(--ok)}
.way li.cur:before{background:var(--acc);border-color:var(--ink);width:18px;height:18px;left:-25px}
.way li.cur{font-weight:800;color:var(--ink)}
.way small{display:block;font-weight:500;color:var(--mute)}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:8px;background:var(--acc);color:#1f2b2e;margin-left:6px}
.sm{border:1px solid var(--ink);background:var(--card);border-radius:9px;padding:7px 11px;font-size:13.5px;font-weight:600}
.sm.red{border-color:var(--bad);color:var(--bad)}
.cta{width:100%;margin-top:12px;padding:13px;border-radius:12px;border:2px solid var(--ink);background:var(--card);font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=password],select{font:inherit;width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.ed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ed .full{grid-column:1/-1}
.ed label{font-size:12px;color:var(--mute)}
.stk{width:90px!important;text-align:center}
.empty{text-align:center;color:var(--mute);padding:34px 10px}
#t{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:20;max-width:90%;text-align:center;display:none}
.cf{position:fixed;top:-12px;width:10px;height:14px;z-index:30;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.8}}
@media (prefers-reduced-motion:reduce){.cf{display:none}.bar i{transition:none}}
html{-webkit-text-size-adjust:100%}button,label{touch-action:manipulation}.lg{width:34px;height:34px;border-radius:9px;vertical-align:middle;margin-right:8px}

:root{--sg:#8b9497;--so:#e08a00;--sv:#3f7d4e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sg:#9aa9ab;--so:#f2a33a;--sv:#7cc18b}}
:root[data-theme="dark"]{--sg:#9aa9ab;--so:#f2a33a;--sv:#7cc18b}
.s0{--s:var(--sg)}.s1{--s:var(--so)}.s2{--s:var(--sv)}
.ord{display:block;width:100%;text-align:left;border:1px solid color-mix(in srgb,var(--s) 55%,var(--line));border-left:9px solid var(--s);background:color-mix(in srgb,var(--s) 14%,var(--card));border-radius:12px;padding:10px 12px;margin-top:8px}
.lk{position:absolute;top:8px;right:46px;display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700;cursor:pointer}.lk input{width:20px;height:20px;margin:0}
.bkb{margin:12px 0;padding:12px;border-radius:12px;border:2px solid var(--acc);background:color-mix(in srgb,var(--acc) 30%,var(--card))}.bkb b{display:block;font-size:16px}.bkb span{display:block;font-size:14px;margin:4px 0 8px}.bkb div{display:flex;gap:8px;flex-wrap:wrap}
.trash{position:absolute;top:6px;right:6px;width:32px;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);font-size:17px;line-height:1;padding:0;cursor:pointer}
.ord .l1{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ord b{font-size:16px;font-weight:700}
.ord small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.stt{display:inline-block;font-size:12px;font-weight:800;padding:1px 9px;border-radius:8px;background:var(--s);color:#fff}
.s1 .stt{color:#1f2b2e}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 2px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:13.5px;font-weight:600}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chk{width:32px;height:32px;accent-color:var(--sv);flex:none}
.cta.ok{background:var(--sv);border-color:var(--sv);color:#fff}
.cta.big2{padding:16px;font-size:17px}
.back{border:0;background:none;color:var(--blue);font-weight:700;padding:10px 0;font-size:15px}
.ft{margin:30px 0 0;text-align:center;color:var(--mute);font-size:12.5px}
.sum2{display:flex;justify-content:space-between;align-items:baseline;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:12px}
.sum2 b{font-size:24px}

.row.miss{background:color-mix(in srgb,var(--bad) 14%,var(--card));border-color:var(--bad);border-left:9px solid var(--bad)}
.row.miss .n b:first-child{color:var(--bad)}
.lack{display:block;color:var(--bad)!important;font-weight:800}
.inl{display:inline!important;font-size:inherit!important;color:var(--ink)}
.pm:disabled{opacity:.4;cursor:default}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:16px}
.ov p{color:#fff;margin:0;text-align:center;font-weight:600}
.ov img{max-width:100%;max-height:68vh;border-radius:12px;-webkit-touch-callout:default}
</style>
</head>

function sha256(str){const rr=(v,a)=>(v>>>a)|(v<<(32-a));const K=[],H=[],isP={};let pc=0;

const hh=H.slice(0,8);const by=Array.from(new TextEncoder().encode(str));const bl=by.length*8;by.push(0x80);while(by.length%64!==56)by.push(0);
for(let i=7;i>=0;i--)by.push(i>=4?0:(bl>>>(i*8))&255);
for(let o=0;o<by.length;o+=64){const w=[];for(let i=0;i<16;i++)w[i]=(by[o+i*4]<<24)|(by[o+i*4+1]<<16)|(by[o+i*4+2]<<8)|by[o+i*4+3];
for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];const s0=rr(a,7)^rr(a,18)^(a>>>3),s1=rr(b,17)^rr(b,19)^(b>>>10);w[i]=(w[i-16]+s0+w[i-7]+s1)|0}
let [a,b,c,d,e,f,g,h]=hh;
for(let i=0;i<64;i++){const S1=rr(e,6)^rr(e,11)^rr(e,25),ch=(e&f)^(~e&g),t1=(h+S1+ch+K[i]+w[i])|0,S0=rr(a,2)^rr(a,13)^rr(a,22),mj=(a&b)^(a&c)^(b&c),t2=(S0+mj)|0;
h=g;g=f;f=e;e=(d+t1)|0;d=c;c=b;b=a;a=(t1+t2)|0}
hh[0]=(hh[0]+a)|0;hh[1]=(hh[1]+b)|0;hh[2]=(hh[2]+c)|0;hh[3]=(hh[3]+d)|0;hh[4]=(hh[4]+e)|0;hh[5]=(hh[5]+f)|0;hh[6]=(hh[6]+g)|0;hh[7]=(hh[7]+h)|0}
return hh.map(x=>('00000000'+(x>>>0).toString(16)).slice(-8)).join('')}

function wrapT(ctx,t,maxW){const L=[];let c='';String(t).split(' ').forEach(w=>{const tt=c?c+' '+w:w;if(ctx.measureText(tt).width>maxW&&c){L.push(c);c=w}else c=tt});if(c)L.push(c);return L}
function rrect(ctx,x,y,w,hh,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+hh,r);ctx.arcTo(x+w,y+hh,x,y+hh,r);ctx.arcTo(x,y+hh,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

H+=toL.length*70+34+20;

H+=40+190+pad;

m.fillStyle=g;m.fillRect(0,0,W,16);

const lg=document.querySelector('img.lg');
if(lg&&lg.complete&&lg.naturalWidth){rrect(m,pad,y,head,head,26);m.save();m.clip();m.drawImage(lg,pad,y,head,head);m.restore()}
m.textBaseline='alphabetic';m.fillStyle='#1f2b2e';m.font='800 64px '+F;m.fillText('Pedido',pad+head+30,y+head/2+4);
m.fillStyle='#5d6b6e';m.font='500 34px '+F;m.fillText(dfmt(o.d),pad+head+30,y+head/2+52);
y+=head+40;
m.fillStyle='#5d6b6e';m.font='600 32px '+F;m.fillText('Para',pad,y+24);y+=40;
m.fillStyle='#1f2b2e';m.font='800 60px '+F;toL.forEach(t=>{y+=62;m.fillText(t,pad,y);y+=8});y+=20;
m.strokeStyle='#d3d9d2';m.lineWidth=3;m.beginPath();m.moveTo(pad,y);m.lineTo(W-pad,y);m.stroke();y+=14;

m.fillStyle='#1f2b2e';m.font='700 38px '+F;let yy=top+38;r.L.forEach(t=>{m.fillText(t,pad,yy);yy+=46});
m.fillStyle='#5d6b6e';m.font='500 31px '+F;m.fillText(i.qty+' × '+eur(i.price),pad,yy-4);
m.fillStyle='#1f2b2e';m.font='700 38px '+F;m.textAlign='right';m.fillText(eur(i.qty*i.price),W-pad,top+38);m.textAlign='left';
y=top+r.h;m.strokeStyle='#d3d9d2';m.lineWidth=2;m.beginPath();m.moveTo(pad,y-14);m.lineTo(W-pad,y-14);m.stroke()});
y+=26;
rrect(m,pad,y,W-pad*2,190,30);m.fillStyle=o.paid?'#3f7d4e':'#1f2b2e';m.fill();
m.fillStyle='#ffffff';m.font='600 36px '+F;m.fillText(o.paid?'Total pagado':'Total a pagar',pad+44,y+76);
m.font='800 84px '+F;m.textAlign='right';m.fillText(eur(otot(o)),W-pad-44,y+150);m.textAlign='left';
return cv}

const BKD=7,dago=iso=>Math.max(0,Math.floor((Date.now()-new Date(iso))/864e5));
function bkBanner(){if(!(S.orders.length||S.sales.length))return '';const l=S.lastBackup,dd=l?dago(l):0;if(l&&dd<BKD)return '';if(S.bkSnooze&&Date.now()<S.bkSnooze)return '';
return `<div class="bkb" role="alert"><b>Haz una copia de seguridad</b><span>${l?'Hace '+dd+' días que no haces copia de tus datos.':'Todavía no has hecho ninguna copia de tus datos.'} Si se borran los datos del navegador, se pierden.</span><div><button class="sm" onclick="exportData()">Exportar copia</button><button class="sm" onclick="bkLater()">Ahora no</button></div></div>`}

async function exportData(){S.lastBackup=new Date().toISOString();save();
const json=JSON.stringify(S,null,1),d=new Date(),pad=n=>String(n).padStart(2,'0');
const fname='Copia-hucha-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.json';
const mh=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.share;
if(mh){mh.postMessage({data:btoa(unescape(encodeURIComponent(json))),ext:'json'});render();return}
const blob=new Blob([json],{type:'application/json'});
try{const file=new File([blob],fname,{type:'application/json'});
if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Copia de la hucha'});render();return}}catch(e){if(e&&e.name==='AbortError')return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);render()}
function importData(inp){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();
r.onload=()=>{let d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.products)||!Array.isArray(d.sales||[])||!Array.isArray(d.orders||[]))throw 0}catch(e){toast('El fichero no es una copia válida');inp.value='';return}
if(!confirm('Se sustituirán todos los datos de este móvil por los de la copia ('+(d.orders||[]).length+' pedidos). ¿Seguro?')){inp.value='';return}
try{const j=JSON.stringify(d);localStorage.setItem(KEY,j);IDB.put(j).then(()=>location.reload())}catch(e){toast('No se pudo importar')}};
r.readAsText(f)}

const fname='Pedidos-profesores-'+d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'.csv';
S.lastTBackup=new Date().toISOString();save();
const mh=window.webkit&&window.webkit.messageHandlers&&window.webkit.messageHandlers.share;
if(mh){mh.postMessage({data:btoa(unescape(encodeURIComponent(csv))),ext:'csv'});render();return}
const blob=new Blob([csv],{type:'text/csv'});
try{const file=new File([blob],fname,{type:'text/csv'});
if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Pedidos de los profesores'});render();return}}catch(e){if(e&&e.name==='AbortError'){render();return}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=fname;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);render()}
async function tLock(id,v){const d=(TD||[]).find(x=>x.id===id);if(!d)return;try{await tPatch(id,{lock:{booleanValue:v}},['lock']);d.lock=v;toast(v?'Pedido bloqueado: el alumno no puede borrarlo':'Pedido desbloqueado')}catch(e){toast('No se pudo guardar el cambio')}render()}
async function tDel(id){const d=(TD||[]).find(x=>x.id===id);if(!d)return;if(d.lock){toast('Está bloqueado: desmarca «Bloquear» para poder borrarlo.');return}
if(!confirm('¿Borrar el pedido de '+d.alumno+'? Desaparecerá para todos los profesores.'))return;
if(!confirm('Segunda confirmación: el pedido de '+d.alumno+' se borrará definitivamente y no se puede recuperar. ¿Borrarlo?'))return;
try{const r=await fetch(FBU()+'/pedidos/'+encodeURIComponent(id)+'?key='+FB.key,{method:'DELETE'});if(!r.ok&&r.status!==404)throw 0;TD=TD.filter(x=>x.id!==id);render();toast('Pedido borrado')}catch(e){toast('No se pudo borrar el pedido')}}
setInterval(()=>{if(TU&&S.tab==='clases'&&!document.hidden)tRefresh()},8000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&TU&&S.tab==='clases')tRefresh()});window.addEventListener('focus',()=>{if(TU&&S.tab==='clases')tRefresh()});
V.clases=()=>{if(!TU)return `<h2 style="margin-top:14px;font-size:22px">Clases</h2><p class="sub">Solo para profesores. Introduce la contraseña.</p>
<div class="ed"><div class="full"><label for="tpw">Contraseña</label><input id="tpw" type="password" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')tTry()"></div></div>
<p id="tpe" class="lack" role="alert" style="margin:8px 0 0;min-height:1.4em"></p><button class="cta ok" onclick="tTry()">Entrar</button>`;
const D=TD||[];const by=c=>D.filter(x=>x.clase===c);
const err=TERR?`<p class="lack" role="alert">${esc(TERR)}</p>`:'';
if(!TC){return `<h2 style="margin-top:14px;font-size:22px">Clases</h2><p class="sub">Elige una clase para ver los pedidos de sus alumnos.</p>${err}${tbk()}`+CLS.map(c=>{const L=by(c),np=L.filter(x=>!x.prep).length;return `<button class="cta" style="text-align:left;padding:16px" onclick="tSel('${c}')"><b style="font-size:19px">${CLN[c]}</b><br><small style="font-weight:500">${L.length} pedido${L.length===1?'':'s'}${np?' · '+np+' por preparar':L.length?' · todo preparado':''}</small></button>`}).join('')+`<button class="cta" onclick="tRefresh()">Actualizar</button>`+tbkBtn()}
const L=by(TC),P0=L.filter(x=>!x.prep),PF=L.filter(x=>x.prep);const m={};P0.forEach(x=>x.items.forEach((i,k)=>{m[i.name]=(m[i.name]||0)+Math.max(0,i.qty-tpv(x,k))}));
let h=`<button class="back" onclick="tSel('')">← Clases</button><h2>${CLN[TC]}</h2>${err}${tbk()}<h2>Material por preparar</h2>`;
const ks=Object.keys(m);h+=ks.length?ks.map(k=>`<div class="row mat${m[k]?'':' done'}"><div class="n"><b>${esc(k)}</b></div><span class="tot">${m[k]} ud.</span></div>`).join(''):'<div class="empty">No hay material pendiente.</div>';
const partTxt=x=>{if(!tpPart(x))return '';const r=x.items.map((i,k)=>[i.name,i.qty-tpv(x,k)]).filter(a=>a[1]>0);return `<div class="falta">Entrega parcial: faltan ${r.map(a=>a[1]+' × '+esc(a[0])).join(', ')}. Lo pendiente quedará en el pedido.</div>`};
const lockc=x=>`<label class="lk"><input type="checkbox" ${x.lock?'checked':''} onchange="tLock('${x.id}',this.checked)" aria-label="Impedir que el alumno borre el pedido de ${esc(x.alumno)}"><span>Bloquear</span></label>`;
const trash=x=>lockc(x)+`<button class="trash" aria-label="Borrar pedido de ${esc(x.alumno)}" title="Borrar pedido" onclick="tDel('${x.id}')">🗑</button>`;
h+='<h2>Pedidos</h2>';
h+=P0.length?P0.map(x=>`<div class="ord s0" style="position:relative">${trash(x)}<div class="l1" style="padding-right:130px"><b>${esc(x.alumno)}</b><span class="stt">${x.parcial?'Entrega parcial':'Por preparar'}</span></div><small>Para: ${esc(x.para)} · ${dfmt(x.d)} · ${eur(x.total)}</small>`+x.items.map((i,k)=>{const v=tpv(x,k);return `<div class="row mat ${v<i.qty?'pend':'done'}"><div class="n"><b>${esc(i.name)}</b><small>Pedidas: ${i.qty}</small></div><div class="ctl"><button class="pm" aria-label="Una menos de ${esc(i.name)}" onclick="tpq('${x.id}',${k},-1)">−</button><span aria-label="Preparadas">${v}</span><button class="pm plus" aria-label="Una más de ${esc(i.name)}" onclick="tpq('${x.id}',${k},1)">+</button></div></div>`}).join('')+partTxt(x)+(tpPart(x)?`<button class="cta" style="margin-top:10px" onclick="tPartial('${x.id}')">Aceptar entrega parcial</button>`:'')+(tpAll(x)?`<button class="cta ok" style="margin-top:10px" onclick="tPrep('${x.id}')">Finalizado</button>`:'')+'</div>').join(''):'<div class="empty">No hay pedidos pendientes en esta clase.</div>';
if(PF.length){h+='<h2>Finalizados</h2>'+PF.map(x=>`<div class="ord s2 fin" style="position:relative">${trash(x)}<div class="l1" style="padding-right:130px"><b>${esc(x.alumno)}</b><span class="stt">Finalizado</span></div><small>Para: ${esc(x.para)} · ${dfmt(x.d)} · ${eur(x.total)}</small><div style="margin-top:6px;font-size:14.5px">${x.items.map(i=>esc(i.name)+' × '+i.qty).join('<br>')}</div><button class="sm" style="margin-top:8px" onclick="tReopen('${x.id}')">Reabrir</button></div>`).join('')}
return h+`<button class="cta" onclick="tRefresh()">Actualizar</button>`+tbkBtn()};

V.info=()=>`<h2 style="margin-top:14px;font-size:22px">Cómo funciona</h2>
<p class="sub">Esta app sirve para apuntar los pedidos de turrón y otros productos del viaje del Camino de Santiago y ver cuánto dinero llevamos recaudado.</p>
<h2>Para los alumnos</h2>
<ol class="gl">
<li><b>Instala la app.</b> Ábrela en Safari (iPhone) o Chrome (Android), pulsa Compartir o el menú y elige «Añadir a pantalla de inicio». Entra siempre desde ese icono.</li>
<li><b>Pon tu nombre y tu clase.</b> Ve a Ajustes. Debajo de la contraseña, en «Alumno», escribe tu nombre y elige 3º A, 3º B, 3º C o PDC. No necesitas contraseña. Solo se hace una vez.</li>
<li><b>Haz un pedido.</b> En Pedidos elige los productos con + y −, escribe para quién es y pulsa Finalizar. El pedido queda guardado en Historial y, si has puesto tu nombre y clase, se envía a los profesores.</li>
<li><b>Sigue el pedido en Historial.</b> Gris: pedido hecho. Naranja: recibido. Verde: pagado. Puedes filtrar por estado.</li>
<li><b>Marca lo que te llega.</b> Abre el pedido y usa − y + para indicar cuántas unidades de cada producto has recibido. Lo que falta aparece en rojo. Con todo recibido, el pedido pasa a naranja.</li>
<li><b>Cobra y marca Pagado.</b> Cuando te paguen, pulsa «Pagado». El pedido se pone verde y su ganancia se suma a la Hucha. Si te equivocas, usa «Deshacer pago».</li>
<li><b>Manda el pedido por WhatsApp.</b> Dentro del pedido, «Compartir pedido» crea una imagen con el contenido, para quién es y el total.</li>
<li><b>Mira la Hucha.</b> En Hucha ves el dinero recaudado, lo que falta para el objetivo y la ganancia por proveedor.</li>
</ol>
<h2>Para los profesores</h2>
<ol class="gl">
<li>Ve a la pestaña <b>Clases</b> y escribe la contraseña de profesores.</li>
<li>Elige una de las cuatro clases. Verás el <b>material por preparar</b> (suma de productos) y los pedidos de cada alumno.</li>
<li>En cada pedido, usa − y + para marcar las unidades que vas entregando. El «material por preparar» de arriba va restando lo marcado. Con todo al máximo aparece «Finalizado» y el pedido pasa a verde, en «Finalizados».</li>
<li>Si no puedes entregar todo, aparece un aviso de <b>entrega parcial</b>. Al pulsar «Aceptar entrega parcial», lo marcado queda como entregado y lo que falta se añade al pedido de la semana siguiente (desde el lunes), que no cuenta en el material de esta semana.</li>
<li>Arriba a la derecha de cada pedido hay una casilla <b>Bloquear</b>. Si la marcas, el alumno no podrá borrar ese pedido (le aparece un aviso). Para borrarlo tú, desmárcala primero. La papelera de cada pedido lo borra para todos los profesores, con doble confirmación. Pulsa «Actualizar» para ver los pedidos nuevos; también se refresca solo.</li>
</ol>
<h2>Importante</h2>
<ol class="gl">
<li>Los pedidos se guardan en el móvil de cada alumno. No borres los datos del navegador ni desinstales la app.</li>
<li>Usa siempre el mismo navegador o el icono de la pantalla de inicio. Si usas otro, verás la app vacía.</li>
<li>Haz de vez en cuando una copia de seguridad: en Hucha o Historial, abajo, pulsa «Exportar copia». Para recuperarla, «Importar copia». Si pasan 7 días sin copia, la app te lo recuerda.</li>
<li>Si no tienes conexión, el pedido se guarda y se envía a los profesores cuando vuelva internet.</li>
<li>Los pedidos enviados a los profesores viajan cifrados. Solo se pueden leer con su contraseña.</li>
</ol>
<h2>Sugerencias o errores</h2>
<p class="sub">Si algo no funciona o tienes ideas para mejorar la app, escribe a:</p>
<a class="cta mail" href="mailto:onthewaycemfs@gmail.com?subject=On%20the%20way%3A%20sugerencia%20o%20error">onthewaycemfs@gmail.com</a>
<p class="sub" style="margin-top:10px">Cuéntanos qué estabas haciendo y qué móvil usas.</p>`;
